version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: spinkitty-postgres
    environment:
      POSTGRES_USER: spinkitty
      POSTGRES_PASSWORD: spinkitty_password
      POSTGRES_DB: spinkitty
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spinkitty-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spinkitty']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: spinkitty-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - spinkitty-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spinkitty-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://spinkitty:spinkitty_password@postgres:5432/spinkitty?schema=public
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
      NODE_ENV: production
    ports:
      - '3000:3000'
    networks:
      - spinkitty-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  spinkitty-network:
    driver: bridge
